# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# version location specification; this defaults to alembic/versions.
version_locations = alembic/versions

# the output encoding used when writing new migration files
output_encoding = utf-8

# Will be overridden dynamically in env.py from settings, but config parser requires a value
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/food_redistribution

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
